name: Build interlinear database

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "schema.sql"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      deploy_to_d1:
        description: "Deploy the built database to Cloudflare D1"
        type: choice
        options: ["false", "true"]
        default: "false"
      d1_tables:
        description: >
          Comma-separated table names to deploy (e.g.
          "lexicon_gloss_translation,ai_gloss"). Leave EMPTY to deploy
          ALL tables -- only intended for the very first deploy or a
          schema change, since the full dataset (1.1M+ rows) exceeds
          D1's free-tier 100,000-rows-written-per-day limit in one run.
          For routine deploys after translation/gloss work, scope this
          to just the table(s) that changed.
        type: string
        default: "lexicon_gloss_translation,ai_gloss"
  # Weekly check for upstream source updates (submodule pins bump separately;
  # this just rebuilds against whatever the pinned commits currently are).
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for softprops/action-gh-release to create releases
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse Greek NT (Textus Receptus)
        run: |
          python3 scripts/parse_tr.py \
            sources/tr/parsed \
            output/staging/tr.jsonl

      - name: Parse Hebrew OT (TAHOT / Masoretic)
        run: |
          python3 scripts/parse_tahot.py \
            "sources/stepbible/Translators Amalgamated OT+NT" \
            output/staging/tahot.jsonl

      - name: Parse lexicons (TBESG / TBESH)
        run: |
          python3 scripts/parse_lexicons.py \
            "sources/stepbible/Lexicons/TBESG - Translators Brief lexicon of Extended Strongs for Greek - STEPBible.org CC BY.txt" \
            "sources/stepbible/Lexicons/TBESH - Translators Brief lexicon of Extended Strongs for Hebrew - STEPBible.org CC BY.txt" \
            output/staging/lexicons.jsonl

      - name: Parse morphology codes (TEGMC / TEHMC)
        run: |
          python3 scripts/parse_morphology.py \
            "sources/stepbible/Morphology codes/TEGMC - Translators Expansion of Greek Morphhology Codes - STEPBible.org CC BY.txt" \
            "sources/stepbible/Morphology codes/TEHMC - Translators Expansion of Hebrew Morphology Codes - STEPBible.org CC BY.txt" \
            output/staging/morphology.jsonl

      - name: Parse proper nouns (TIPNR)
        run: |
          python3 scripts/parse_tipnr.py \
            "sources/stepbible/Proper Nouns/TIPNR - Translators Individualised Proper Names with all References - STEPBible.org CC BY.txt" \
            output/staging/tipnr.jsonl

      - name: Build SQLite database
        run: |
          python3 scripts/build_db.py \
            --staging output/staging \
            --schema schema.sql \
            --out output/interlinear.sqlite
          python3 scripts/load_lexicon_categories.py \
            --db output/interlinear.sqlite \
            --jsonl sources/strong_categories.jsonl

      - name: Resolve ambiguous proper nouns
        run: |
          python3 scripts/resolve_proper_nouns.py --db output/interlinear.sqlite

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: interlinear-sqlite
          path: output/interlinear.sqlite
          retention-days: 30

      # Publish the built DB to a dedicated orphan branch as a single
      # commit each run (force-pushed), so main's history stays clean
      # but there's still a stable, unauthenticated raw-file URL:
      #   https://raw.githubusercontent.com/<owner>/<repo>/db/interlinear.sqlite
      - name: Publish to db branch
        run: |
          rm -rf /tmp/dbpub && mkdir /tmp/dbpub
          ls output/staging
          cp output/interlinear.sqlite /tmp/dbpub/
          cp output/staging/* /tmp/dbpub/
          cd /tmp/dbpub
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b db
          git add .
          git commit -q -m "Build $(date -u +%Y-%m-%dT%H:%M:%SZ) (${GITHUB_SHA::7})"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attach to a GitHub Release for a stable, directly-fetchable URL
      # (only runs on tagged commits, e.g. `git tag v0.1.0 && git push --tags`).
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/interlinear.sqlite

  deploy-d1:
    # Manual-only: deploying to the public D1 database is a deliberate
    # action, not something that should happen automatically on every
    # push. Trigger via: Actions tab -> this workflow -> Run workflow ->
    # set deploy_to_d1 to "true", and set d1_tables to scope which
    # tables get deployed (defaults to the two incrementally-growing
    # tables; leave d1_tables EMPTY only for the rare full-dataset
    # deploy, which exceeds the D1 free-tier daily row-write limit in
    # one run -- see deploy_to_d1.sh's own comments for the reasoning).
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_d1 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: interlinear-sqlite
          path: output/

      - name: Set up Node (for wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to D1
        run: |
          if [ -n "${{ inputs.d1_tables }}" ]; then
            echo "Scoped deploy: --tables ${{ inputs.d1_tables }}"
            bash scripts/deploy_to_d1.sh "${{ vars.D1_DATABASE_NAME }}" --fresh --tables "${{ inputs.d1_tables }}"
          else
            echo "UNSCOPED full deploy -- all tables (1.1M+ rows). This will likely exceed the D1 free-tier 100,000 rows/day limit in one run."
            bash scripts/deploy_to_d1.sh "${{ vars.D1_DATABASE_NAME }}" --fresh
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}